<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ozzy Hutchings</title>
  <style>
    body {
      background-color: #e3f2ff;
      font-family: Calibri, Candara, Segoe, 'Segoe UI', Optima, sans-serif;
      line-height: 1.6;
      max-width: 800px;
      margin: 0 auto;
      padding: 2rem;
      color: #052642;
    }
    .subtitle { color: #032645; font-size: 1.2rem; }

    .page-container {
      background-color: #ffffff;
      max-width: 850px;
      margin: 0 auto;
      padding: 3rem 2.5rem;
      min-height: 100vh;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.08);
    }
     
    header { margin-bottom: 2.5rem; }
    h1 { margin-bottom: 0.5rem; color: #01284a; }
    .project { margin-bottom: 2.5rem; }
    .project img {
      max-width: 100%;
      height: auto;
      border-radius: 6px;
      display: block;
      margin: 1rem 0;
    }
      .eer-banner {
    background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('images/BonusFav.jpg');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    width: calc(100% + 5rem);
    margin-left: -2.5rem;
   
    min-height: 250px;
    padding: 3rem 1.5rem;
    box-sizing: border-box;
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 0px;
    }
   
    a { color: #0066cc; text-decoration: none; }
    a:hover { text-decoration: underline; }
   
    .eer-banner h2 { color: #ffffff; font-size: 2.2rem; margin: 0; text-shadow: 0 2px 6px rgba(0, 0, 0, 0.7); text-align: center; }
   
    .image-grid-section { max-width: 1100px; margin: 0 auto; padding: 20px; }
    .image-grid-section img { width: 100%; height: 250px; object-fit: cover; object-position: center; display: block; }
   
    .featured-item { margin-bottom: 40px; }
    .featured-item .caption { margin-bottom: 15px; margin-top: 20px; }
   
    .three-column-grid {
      display: flex !important;
      flex-direction: row !important;
      gap: 20px;
      width: 100%;
    }
    .grid-item { flex: 1 1 0px !important; min-width: 0; overflow: hidden; }
    .grid-item .caption { margin-top: 12px; margin-bottom: 40px; }
    .grid-item img { width: 100%; height: 170px; object-fit: cover; object-position: center; display: block; }
   
    @media (max-width: 768px) { .three-column-grid { flex-direction: column; gap: 30px; } }
   
  </style>
</head>
<body>
